<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
</style>
<title>猫猫小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one centred column — a wooden frame around the pixel scene, parchment panels below (single warm-wood look, both host themes) */
:root{
  --bg:#33261b; --wood:#6b4a32; --wood-dark:#4a3222; --wood-light:#8a6142;
  --paper:#f3e3c3; --paper-hi:#fbefd6; --ink:#4a3322; --muted:#8a6d52; --accent:#d9773a;
  --pix:"DotGothic16","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
[hidden]{display:none!important}
body{color:var(--paper);font-family:var(--pix);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-size:28px;margin:0;font-weight:400;letter-spacing:.06em;text-wrap:balance}
.sub{font-size:15px;color:#cdb38e;margin-left:10px;letter-spacing:.08em}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:2px solid var(--wood-dark);box-shadow:0 2px 0 #22170f}
.lang button{box-shadow:none;border:0;padding:4px 10px;font-size:14px;background:var(--wood);color:#e8d3b0}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff8ec}
.lang button:active{transform:none}

.when{display:flex;align-items:baseline;gap:10px}
.date{font-size:16px;color:#cdb38e;letter-spacing:.04em}
.clock{font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.scene{background:var(--wood);border:4px solid var(--wood-dark);box-shadow:inset 0 0 0 2px var(--wood-light),0 4px 0 #22170f;padding:6px;border-radius:4px}
canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:232/172;image-rendering:pixelated;image-rendering:crisp-edges;background:#7cc4ee}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--wood-dark);box-shadow:0 3px 0 #22170f;padding:12px 14px;border-radius:3px}
.status{font-size:18px;display:flex;gap:10px;align-items:center;min-height:1.6em}
.party{background:var(--accent);color:#fff8ec;font-size:17px;border-color:var(--wood-dark)}
.status .dot{width:10px;height:10px;background:var(--accent);flex:none}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.controls label{font-size:15px;color:var(--muted)}
input[type=range]{flex:1 1 180px;min-width:0;accent-color:var(--accent)}
.ptime{font-variant-numeric:tabular-nums;min-width:4.5ch;font-size:16px}
button{font-family:var(--pix);font-size:15px;background:var(--accent);color:#fff8ec;border:2px solid var(--wood-dark);padding:6px 12px;cursor:pointer;box-shadow:0 2px 0 var(--wood-dark)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
summary{font-size:15px;color:var(--muted);letter-spacing:.08em;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:6px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details[open] summary{margin-bottom:8px}
summary:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
.sched{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.sched li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border:2px solid transparent;font-size:15px}
.sched li.now{border-color:var(--accent);background:var(--paper-hi)}
.sched .t{font-variant-numeric:tabular-nums;color:var(--muted)}
</style>

</head>
<body>
<main>
  <header>
    <h1><span data-i="title">猫猫小屋</span><span class="sub" data-i="sub" hidden>初夏 · 晴</span></h1>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-zh" data-lang="zh" aria-pressed="true">CN</button>
        <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="when"><span class="date" id="date"></span><span class="clock" id="clock">--:--</span></div>
    </div>
  </header>

  <div class="scene"><canvas id="c"></canvas></div>

  <div class="panel party" id="party" hidden><span id="party-text"></span></div>

  <div class="panel status" aria-live="polite"><span class="dot"></span><span id="status">…</span></div>

  <details class="panel" id="routine" hidden>
    <summary data-i="routine">猫猫的作息</summary>
    <ul class="sched" id="sched">
      <li data-k="eat540"><span data-i="breakfast">早饭</span><span class="t" data-about="09:00">09:00</span></li>
      <li data-k="eat720"><span data-i="lunch">午饭</span><span class="t" data-about="12:00">12:00</span></li>
      <li data-k="eat1080"><span data-i="dinner">晚饭</span><span class="t" data-about="18:00">18:00</span></li>
      <li data-k="sleep"><span data-i="bed">睡觉</span><span class="t">22:30</span></li>
      <li data-k="groom"><span data-i="groom">舔毛</span><span class="t" data-i="random">随机</span></li>
      <li data-k="toilet"><span data-i="toilet">上厕所</span><span class="t" data-i="toiletWhen">每天 4 次</span></li>
    </ul>
  </details>

  <div class="panel controls" hidden>
    <label for="slider" data-i="preview">时间预览</label>
    <input type="range" id="slider" min="0" max="1435" step="5" value="720">
    <span class="ptime" id="ptime">现在</span>
    <button type="button" id="now" data-i="back">回到现在</button>
  </div>
</main>

<script>
(() => {
const W = 232, H = 172, HX = 26, HY = 48;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- colour helpers ----------
const C = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const S = a => `rgb(${a.map(Math.round).join(',')})`;
const NIGHT = C('#1c2250');
let NK = 0, dl = 1, night = 0, skyTop = C('#7cc4ee'), skyBot = C('#c8ecfa');
const sh = h => S(lerp(C(h), NIGHT, NK));                 // outdoor colours dim at night
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const O = (x, y, w, h, c) => R(x, y, w, h, sh(c));        // outdoors
let OX = 0; // horizontal offset while drawing a room that moved right when the house got wider
const L = (x, y, w, h, c) => R(HX + OX + x, HY + y, w, h, c);  // inside the house
const LO = (x, y, w, h, c) => R(HX + x, HY + y, w, h, sh(c)); // house exterior (roof)

const kfc = fr => fr.map(([m, v]) => [m, typeof v === 'string' ? C(v) : v]);
function kf(fr, m) {
  for (let i = 0; i < fr.length - 1; i++) {
    const [a, x] = fr[i], [b, y] = fr[i + 1];
    if (m >= a && m <= b) { const t = (m - a) / (b - a || 1); return typeof x === 'number' ? x + (y - x) * t : lerp(x, y, t); }
  }
  return fr[fr.length - 1][1];
}
// Seasons follow the real calendar (UK meteorological seasons). Sunrise/sunset are the UK
// seasonal averages in local clock time (minutes after midnight). Keep in sync with bot's cat.py.
const SUN = { spring: [360, 1180], summer: [310, 1255], autumn: [415, 1070], winter: [465, 990] };
const seasonOf = mo => (mo >= 2 && mo <= 4) ? 'spring' : (mo >= 5 && mo <= 7) ? 'summer' : (mo >= 8 && mo <= 10) ? 'autumn' : 'winter';
function dlfFor(season) { const [sr, ss] = SUN[season]; return [[0,0],[sr - 60,0],[sr + 30,1],[ss - 30,1],[ss + 60,0],[1440,0]]; }
const DAYSKY = { spring: ['#80c8f0', '#d0eefa'], summer: ['#7cc4ee', '#c8ecfa'], autumn: ['#86bfe2', '#d6eaf2'], winter: ['#9cc5e2', '#e2edf3'] };
function skyFor(season) {
  const [sr, ss] = SUN[season], [dt, db] = DAYSKY[season];
  return [
    kfc([[0,'#0e1233'],[sr-70,'#0e1233'],[sr-30,'#4a3f7a'],[sr+10,'#f0a07a'],[sr+60,dt],[ss-60,dt],[ss,'#e88a5c'],[ss+45,'#3d2f66'],[ss+90,'#0e1233'],[1440,'#0e1233']]),
    kfc([[0,'#1d2552'],[sr-70,'#1d2552'],[sr-30,'#e59a7a'],[sr+10,'#ffd59a'],[sr+60,db],[ss-60,db],[ss,'#ffc27a'],[ss+45,'#a0607a'],[ss+90,'#1d2552'],[1440,'#1d2552']]),
  ];
}
const PAL = {
  spring: { hill1: '#94c878', hill2: '#7fb865', ground: '#76b65a', top: '#a0d27e', tuft: '#5a9a44',
            leaf: '#55a052', leafDk: '#3f8a44', leafLt: '#7cc070', dots: ['#f5b8cc', '#ffffff'], flowers: ['#f5b8cc','#ffe066','#ffffff','#f5b8cc'] },
  summer: { hill1: '#86b86d', hill2: '#73a95b', ground: '#6aa84f', top: '#8fc46e', tuft: '#4f8a3b',
            leaf: '#3f8a44', leafDk: '#2f6e38', leafLt: '#5aa858', dots: ['#e8584a'], flowers: ['#f28fb0','#ffe066','#ffffff','#c9a0f0'] },
  autumn: { hill1: '#b3aa62', hill2: '#9c9a55', ground: '#8f9a4e', top: '#b2b46c', tuft: '#6e7a3a',
            leaf: '#d9822b', leafDk: '#a8502a', leafLt: '#f0b04a', dots: ['#c0402a'], flowers: ['#d9822b','#c0502b','#e8b04a','#a8502a'] },
  winter: { hill1: '#dfe8ee', hill2: '#cfdbe3', ground: '#e9f0f4', top: '#ffffff', tuft: '#a9b8c2',
            leaf: null, leafDk: null, leafLt: null, dots: [], flowers: [] },
};
let SEASON = seasonOf(new Date().getMonth()), P = PAL[SEASON], DLF = dlfFor(SEASON);
let [SKYT, SKYB] = skyFor(SEASON);

// ---------- deterministic randomness per day ----------
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const STARS = Array.from({ length: 22 }, (_, i) => { const r = rng(i * 97 + 5); return [Math.floor(r() * W), Math.floor(r() * 70), r() * 6]; });
const FLOWERS = Array.from({ length: 34 }, (_, i) => { const r = rng(i * 31 + 11); return [Math.floor(r() * W), 147 + Math.floor(r() * 23), ['#f28fb0','#ffe066','#ffffff','#c9a0f0'][Math.floor(r() * 4)]]; });
const TUFTS = Array.from({ length: 40 }, (_, i) => { const r = rng(i * 53 + 7); return [Math.floor(r() * W), 146 + Math.floor(r() * 25)]; });

// ---------- outdoors ----------
function drawSky(m, t) {
  for (let y = 0; y < 144; y += 4) R(0, y, W, 4, S(lerp(skyTop, skyBot, Math.min(1, y / 136))));
  if (night > 0.25) {
    for (const [x, y, p] of STARS) { g.globalAlpha = Math.min(1, night * 1.2) * (0.55 + 0.45 * Math.sin(t * 1.6 + p)); R(x, y, 1, 1, '#fff6d0'); }
    g.globalAlpha = 1;
  }
  const [sr, ss] = SUN[SEASON];
  if (m > sr - 20 && m < ss + 20) { // sun
    const p = (m - sr + 20) / (ss - sr + 40), x = 6 + p * (W - 14), y = 62 - Math.sin(Math.PI * p) * (SEASON === 'winter' ? 40 : 54);
    g.globalAlpha = 0.25; R(x - 5, y - 4, 10, 8, '#fff2b0'); R(x - 4, y - 5, 8, 10, '#fff2b0'); g.globalAlpha = 1;
    R(x - 3, y - 2, 6, 4, '#ffe27a'); R(x - 2, y - 3, 4, 6, '#ffe27a'); R(x - 1, y - 2, 2, 1, '#fff6c8');
  }
  if (night > 0.35 && (m > ss + 20 || m < sr - 20)) { // crescent moon, once the sun is down
    g.globalAlpha = Math.min(1, (night - 0.35) * 2.5);
    R(210, 9, 6, 8, '#f4eccd'); R(209, 10, 8, 6, '#f4eccd');
    R(212, 8, 6, 8, S(skyTop)); R(213, 9, 6, 6, S(skyTop));
    g.globalAlpha = 1;
  }
  const cc = S(lerp(lerp(C('#ffffff'), C('#ffd2b8'), Math.max(0, 1 - dl) * 0.8), C('#2e3360'), night * 0.85));
  [[10, 12, 0.9], [90, 24, 0.6], [160, 6, 0.75]].forEach(([bx, y, sp]) => {
    const x = ((bx + t * sp * (reduced ? 0.15 : 1)) % (W + 50)) - 30;
    R(x, y + 2, 22, 4, cc); R(x + 3, y, 10, 3, cc); R(x + 11, y - 1, 7, 3, cc); R(x + 2, y + 5, 16, 1, cc);
  });
}

function drawLand(m, t) {
  for (let x = 0; x < W; x += 2) { const h = Math.round(126 + 5 * Math.sin(x / 23) + 3 * Math.sin(x / 9 + 1)); O(x, h, 2, 144 - h, P.hill1); }
  for (let x = 0; x < W; x += 2) { const h = Math.round(134 + 3 * Math.sin(x / 15 + 2)); O(x, h, 2, 144 - h, P.hill2); }
  O(0, 144, W, 28, P.ground); O(0, 144, W, 1, P.top);
  for (const [x, y] of TUFTS) { O(x, y, 1, 2, P.tuft); O(x + 2, y + 1, 1, 1, P.tuft); }
  if (SEASON === 'autumn') { // fallen leaves instead of flowers
    FLOWERS.forEach(([x, y], i) => { if (i % 2 === 0) O(x, y, 2, 1, P.flowers[i % 4]); });
  } else if (P.flowers.length) {
    FLOWERS.forEach(([x, y], i) => { const c = P.flowers[i % 4]; O(x, y, 1, 1, c); O(x, y + 1, 1, 1, P.tuft); });
  }
  // door step + a dirt path winding from the front door down the lawn
  for (let y = 144; y < H; y++) {
    const k = y - 144, w = 8 + Math.floor(k / 9), cx = 33 + Math.round(k * 0.6 + 2 * Math.sin(k / 5));
    O(cx - (w >> 1), y, w, 1, SEASON === 'winter' ? '#d9ccb6' : '#c9a878');
    O(cx - (w >> 1), y, 1, 1, '#a88a5e'); O(cx - (w >> 1) + w - 1, y, 1, 1, '#a88a5e');
  }
  [[31, 151], [37, 158], [43, 165], [36, 168]].forEach(([x, y]) => O(x, y, 2, 1, '#b39468'));
  O(HX - 1, 144, 17, 2, '#b9b0a0'); O(HX - 1, 144, 17, 1, '#d3cbbb');
  tree(12, 146); tree(220, 146);
  if (SEASON === 'autumn' && !reduced) { // a few leaves drifting down from the trees
    for (let i = 0; i < 4; i++) {
      const p = (t * 0.08 + i / 4) % 1, x0 = i % 2 ? 220 : 12;
      O(x0 - 8 + i * 4 + Math.sin(p * 9 + i) * 4, 112 + p * 34, 2, 1, P.flowers[i % 3]);
    }
  }
  if (SEASON === 'winter' && !reduced) { // gentle snowfall
    for (let i = 0; i < 26; i++) {
      const r = rng(i * 41 + 9), x0 = r() * W, sp = 0.5 + r() * 0.6, ph = r();
      const y = ((t * 6 * sp + ph * H) % H), x = (x0 + Math.sin(t * 0.7 + i) * 3) % W;
      g.globalAlpha = 0.85; R(x, y, 1, 1, '#ffffff');
    }
    g.globalAlpha = 1;
  }
  if (dl > 0.6 && (SEASON === 'spring' || SEASON === 'summer')) { // butterfly
    const bx = 70 + 46 * Math.sin(t * 0.27), by = 153 + 5 * Math.sin(t * 1.3), up = Math.floor(t * 8) % 2;
    R(bx, by, 1, 2, '#5a4030');
    if (up) { R(bx - 2, by - 1, 2, 2, '#fff1a0'); R(bx + 1, by - 1, 2, 2, '#fff1a0'); }
    else { R(bx - 2, by + 1, 2, 1, '#fff1a0'); R(bx + 1, by + 1, 2, 1, '#fff1a0'); }
  }
  if (night > 0.5 && SEASON === 'summer') { // fireflies
    for (let i = 0; i < 7; i++) {
      const r = rng(i * 17 + 3), x = r() * W, y = 132 + r() * 34, ph = r() * 6;
      g.globalAlpha = night * Math.max(0, Math.sin(t * 1.4 + ph));
      R(x + 3 * Math.sin(t * 0.5 + ph), y + 2 * Math.cos(t * 0.6 + ph), 1, 1, '#eaff8a');
    }
    g.globalAlpha = 1;
  }
}

function tree(cx, b) {
  if (SEASON === 'winter') { // bare branches with a little snow
    O(cx - 2, b - 30, 4, 30, '#6e4a30'); O(cx - 1, b - 30, 1, 30, '#86603e');
    [[-1, -26, -8, -36], [1, -24, 9, -34], [-1, -18, -10, -24], [1, -16, 9, -22], [0, -30, 1, -40]].forEach(([x0, y0, x1, y1]) => {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let k = 0; k <= n; k++) O(cx + Math.round(x0 + (x1 - x0) * k / n), b + Math.round(y0 + (y1 - y0) * k / n), 1, 1, '#6e4a30');
      O(cx + x1 - 1, b + y1 - 1, 3, 1, '#ffffff');
    });
    return;
  }
  // trunk runs up into the canopy so the two always join
  O(cx - 2, b - 24, 4, 24, '#7a5234'); O(cx - 1, b - 24, 1, 24, '#93673f');
  O(cx - 9, b - 34, 18, 14, P.leaf); O(cx - 7, b - 38, 14, 4, P.leaf); O(cx - 11, b - 30, 22, 8, P.leaf);
  O(cx - 10, b - 23, 20, 3, P.leafDk);
  O(cx - 2, b - 20, 4, 2, '#7a5234'); O(cx - 1, b - 20, 1, 2, '#93673f');
  O(cx - 6, b - 36, 6, 3, P.leafLt); O(cx - 9, b - 30, 4, 3, P.leafLt); O(cx + 3, b - 32, 3, 2, P.leafLt);
  P.dots.forEach((c, i) => { O(cx - 3 + i * 4, b - 27 - i * 5, 1, 1, c); O(cx + 5 - i * 9, b - 25 - i * 6, 1, 1, c); O(cx - 7 + i * 3, b - 33, 1, 1, c); });
}

// ---------- house ----------
function drawRoof(t) {
  for (let r = 0; r < 27; r++) {
    const ins = r * 3, x = -6 + ins, w = 192 - 2 * ins, y = -1 - r;
    LO(x, y, w, 1, SEASON === 'winter' && r > 14 ? '#f4f7fa' : (r % 4 === 0 ? '#8e3b2e' : '#b5523e'));
    LO(x, y, 1, 1, '#6e2c22'); LO(x + w - 1, y, 1, 1, '#6e2c22');
  }
  LO(134, -27, 9, 16, '#8c6a5a'); LO(133, -28, 11, 2, SEASON === 'winter' ? '#f4f7fa' : '#6f5246');
  for (let i = 0; i < 3; i++) LO(135 + (i % 2) * 3, -24 + i * 4, 4, 1, '#735548');
  if (dl > 0.4 && !reduced) for (let i = 0; i < 3; i++) { // chimney smoke
    const p = (t * 0.25 + i / 3) % 1; g.globalAlpha = (1 - p) * 0.55 * dl;
    R(HX + 137 + Math.sin(p * 6 + i) * 3 + p * 6, HY - 31 - p * 16, 3, 3, '#eeeeee');
  }
  g.globalAlpha = 1;
  LO(-6, -1, 192, 2, '#5a3a26');
}

function win(x, y, w, h, opt = {}) {
  L(x - 1, y - 1, w + 2, h + 2, '#7a5236');
  for (let yy = 0; yy < h; yy++) L(x, y + yy, w, 1, S(lerp(skyTop, skyBot, Math.min(1, (HY + y + yy) / 136))));
  if (!opt.frost) { L(x, y + h - 3, w, 3, sh(P.hill1)); if (dl > 0.5 && P.leaf) L(x + 2, y + h - 5, 3, 2, sh(P.leaf)); }
  if (night > 0.55 && !opt.frost) L(x + 2, y + 2, 1, 1, '#fff6d0');
  if (fwFlash) { g.globalAlpha = 0.45 * fwFlash[1]; L(x, y, w, h, fwFlash[0]); g.globalAlpha = 1; } // fireworks light up the glass
  if (opt.frost) { g.globalAlpha = 0.55; L(x, y, w, h, '#eef7fa'); g.globalAlpha = 1; }
  L(x + (w >> 1), y, 1, h, '#7a5236'); L(x, y + (h >> 1), w, 1, '#7a5236');
  L(x - 2, y + h + 1, w + 4, 1, '#9a7050');
  if (opt.curtain) { L(x - 3, y - 2, 2, h + 3, opt.curtain); L(x + w + 1, y - 2, 2, h + 3, opt.curtain); L(x - 4, y - 3, w + 8, 1, '#5a3a26'); }
}

function woodFloor(x, y, w) {

    p(3, 4, 4, 3, CB); p(6, 5, 1, 3, CL);                                  // torso, belly
    p(7, 4, 4, 1, CB); p(7, 5, 2, 1, CB); p(11, 4, 1, 1, CL);              // front legs + paw over the rim
    head(5, f);                                                            // dips in and out

    const fy = Math.round(wander(37, t, 61, 72, 0.3, 1.0, 0.2)[0]);
    L(AX - 1, 50, 3, 1, '#5a3a26');
    for (let k = 0; k <= 12; k++) L(Math.round(AX + (fx - AX) * k / 12), Math.round(51 + (fy - 51) * k / 12), 1, 1, '#7a5236');
    L(fx - 1, fy, 3, 2, '#c9a0f0'); L(fx, fy + 2, 1, 2, '#f28fb0'); L(fx - 2, fy + 1, 1, 1, '#c9a0f0');
    const catX = wander(23, t - 0.3, AX - 9, AX + 9, 0.25, 1.1, 0.12)[0] - 9, up = jumpAt(t);
    return drawCat(catX, 90 - up, 1, up ? 'walk' : 'sit', 0, 1);
  }
  if (kind === 'box') {            // a cardboard box on the bedroom rug; the cat ducks in and peeks out
    const peek = Math.sin(t * 1.4) > -0.2;
    g.save(); g.beginPath(); g.rect(HX + 40, HY + 2, 40, 39); g.clip(); // only above the bedroom floor (y < 41)
    const pos = drawCat(51, peek ? 40 : 46, 1, 'sit', 0, 1);
    g.restore();
    L(48, 32, 19, 9, '#c8955a'); L(48, 32, 19, 1, '#a8743a'); L(48, 40, 19, 1, '#a8743a');   // box, bottom on the floor line
    L(46, 30, 4, 2, '#d8a76a'); L(65, 30, 4, 2, '#d8a76a'); L(55, 35, 5, 2, '#a8743a');
    return pos;
  }
  // bubbles: background ones drift up; every 1.6 s the cat walks under one, leaps, swats it and it pops
  const bub = (x, y, a) => {
    g.globalAlpha = a;
    L(x, y - 1, 2, 1, '#bfe6ff'); L(x - 1, y, 1, 2, '#bfe6ff'); L(x + 2, y, 1, 2, '#bfe6ff'); L(x, y + 2, 2, 1, '#bfe6ff'); L(x, y, 1, 1, '#ffffff');
    g.globalAlpha = 1;
  };
  for (let i = 0; i < 4; i++) {
    const p = (t * 0.18 + i / 4) % 1;
    bub(Math.round(64 + i * 14 + Math.sin(p * 6 + i) * 3), Math.round(86 - p * 32), 0.7 - p * 0.5);
  }
  const PER = 1.6, c = Math.floor(t / PER), ph = (t / PER) % 1;
  const spot = k => 60 + Math.floor(rng(k * 7 + 3)() * 46);           // cat x for cycle k, stays on the open floor
  const from = spot(c - 1), to = spot(c), dir = to >= from ? 1 : -1;
  let x = to, up = 0, pose = 'sit';
  if (ph < 0.3) { x = from + (to - from) * (ph / 0.3); pose = 'walk'; }   // trot over
  else if (ph < 0.7) { up = Math.round(Math.sin((ph - 0.3) / 0.4 * Math.PI) * 10); pose = 'walk'; } // leap
  const headX = dir > 0 ? x + 12 : x + 1;                                 // front of the cat
  const target = { x: headX + dir * 2, y: 90 - 22 };
  if (ph < 0.5) bub(target.x, target.y + Math.round(Math.sin(t * 3) * 1), 1);      // the bubble it's going for
  else if (ph < 0.62) {                                                   // pop!
    g.globalAlpha = 1 - (ph - 0.5) / 0.12;
    [[-2, -2], [3, -2], [-2, 3], [3, 3], [0, -3], [0, 4]].forEach(([dx, dy]) => L(target.x + dx, target.y + dy, 1, 1, '#ffffff'));
    g.globalAlpha = 1;
  }
  const pos = drawCat(x, 90 - up, dir, pose, Math.floor(t * 8) % 2, 1);
  if (ph >= 0.4 && ph < 0.62) { // paw stretched up at the top of the leap
    const pxp = dir > 0 ? pos[0] + 12 : pos[0] + 1;
    R(pxp, pos[1] + 1, 2, 2, '#f8dcae'); R(pxp, pos[1] + 3, 2, 1, '#e8963f');
  }
  return pos;
}
// ---- 当天任务清空的奖励：bot 的"去看看"链接会带上 ?clear=今天日期 ----
const CLEAR_PARAM = (() => { try { return new URLSearchParams(location.search).get('clear'); } catch (e) { return null; } })();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let partyDay = '', partyOn = false, partyShown = null;
function isParty(d) {
  const today = ymd(d);
  if (today === partyDay) return partyOn;
  partyDay = today;
  partyOn = location.hash === '#party';
  if (CLEAR_PARAM === today) { partyOn = true; try { localStorage.setItem('cat-clear', today); } catch (e) {} }
  else { try { if (localStorage.getItem('cat-clear') === today) partyOn = true; } catch (e) {} }
  return partyOn;
}
// 当天限定装饰：0 彩旗 / 1 向日葵 / 2 气球（按日期轮换，和 bot 的 cat.py 一致）
function drawDecor(kind, t) {
  if (kind === 0) { // bunting across both upstairs rooms
    const COLS = ['#e8584a', '#f2c46d', '#6f9fd8', '#9bbb59', '#c9a0f0'];
    for (const [x0, x1] of [[4, 87], [93, 177]]) {
      for (let x = x0; x < x1; x++) { const sag = Math.round(2 * Math.sin(Math.PI * (x - x0) / (x1 - x0))); L(x, 4 + sag, 1, 1, '#7a5236'); }
      for (let x = x0 + 2, i = 0; x < x1 - 4; x += 7, i++) {
        const sag = Math.round(2 * Math.sin(Math.PI * (x + 2 - x0) / (x1 - x0))), c = COLS[i % COLS.length];
        L(x, 5 + sag, 5, 1, c); L(x + 1, 6 + sag, 3, 1, c); L(x + 2, 7 + sag, 1, 1, c);
      }
    }
  } else if (kind === 1) { // sunflowers in a vase on the dining table
    L(86, 71, 5, 5, '#6f9fd8'); L(86, 71, 5, 1, '#8fb7e6'); 
    L(87, 63, 1, 8, '#4f9a4a'); L(89, 65, 1, 6, '#4f9a4a'); L(85, 67, 2, 1, '#4f9a4a');
    L(85, 60, 5, 4, '#f7c531'); L(86, 59, 3, 6, '#f7c531'); L(86, 61, 3, 2, '#7a4a20');
    L(89, 63, 4, 3, '#f7c531'); L(90, 62, 2, 5, '#f7c531'); L(90, 63, 2, 2, '#7a4a20');
  } else { // balloons tied to the left dining chair, bobbing gently
    const bob = reduced ? 0 : Math.round(Math.sin(t * 1.5));
    [[66, 55, '#e8584a'], [71, 52, '#6f9fd8'], [76, 56, '#f2c46d']].forEach(([x, y, c], i) => {
      const yy = y + (i === 1 ? -bob : bob);
      for (let k = yy + 6; k < 71; k++) L(73 + Math.round((x + 2 - 73) * (71 - k) / (71 - yy - 6)), k, 1, 1, '#d9d0c0');
      L(x, yy + 1, 5, 4, c); L(x + 1, yy, 3, 6, c); L(x + 1, yy + 1, 1, 2, '#ffffff'); L(x + 2, yy + 6, 1, 1, c);
    });
  }
}
let lastDate = '';
// 中文：10月25日 周日；English (UK): Sun 25 Oct — month spelled out so it never reads as a number order
const EN_DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], EN_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => LANG === 'zh'
  ? `${d.getMonth() + 1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`
  : `${EN_DAY[d.getDay()]} ${d.getDate()} ${EN_MON[d.getMonth()]}`;
let preview = null, jump = true, last = performance.now(), lastTxt = '', lastK = '';
const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
slider.value = Math.floor(nowMinutes() / 5) * 5;
slider.addEventListener('input', () => { preview = +slider.value; ptime.textContent = hhmm(preview); jump = true; });
$('now').addEventListener('click', () => { preview = null; ptime.textContent = T('now'); slider.value = Math.floor(nowMinutes() / 5) * 5; jump = true; });

function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = T(el.dataset.i); });
  document.querySelectorAll('[data-about]').forEach(el => { el.textContent = T('about') + el.dataset.about; });
  cv.setAttribute('aria-label', T('aria'));
  if (preview === null) ptime.textContent = T('now');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  lastTxt = ''; lastDate = ''; partyShown = null;
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem('cat-lang', LANG); } catch (e) {}
  applyLang();
}));
applyLang();

function frame(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  const t = ts / 1000, m = preview ?? nowMinutes();
  const d = new Date(), seed = d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
  const sea = seasonOf(d.getMonth());
  if (sea !== SEASON) { SEASON = sea; P = PAL[SEASON]; DLF = dlfFor(SEASON); [SKYT, SKYB] = skyFor(SEASON); }
  dl = kf(DLF, m); night = 1 - dl; NK = night * 0.62;
  skyTop = kf(SKYT, m); skyBot = kf(SKYB, m);

  todayMeals = mealsFor(seed);
  const st = catState(m, seed);
  const playing = playLeft() > 0;
  if (playing) jump = true; else { moveCat(st.spot, dt, jump); jump = false; }
  const lightsOn = night > 0.15 && m >= WAKE && m < SLEEP; // lights on whenever it's dark and the cat is up
  const bedLamp = lightsOn;

  drawSky(m, t);
  if (playing && playKind === 'fireworks') drawFireworks(t); else fwFlash = null;
  drawLand(m, t); drawRoof(t);
  L(0, 0, 180, 96, '#5c3d29'); L(0, 0, 180, 1, '#7a5236');
  bedroom(m, bedLamp); study(m, lightsOn); kitchen(m, lightsOn, !!st.food); bathroom();
  const party = isParty(d), decor = seed % 3;
  if (party) drawDecor(decor, t);

  const pose = playing ? 'play' : (cat.walking ? 'walk' : st.pose);
  const rate = { walk: 5, eat: 3, groom: 2, sleep: 0.7, sit: 0, play: 0 }[pose];
  const f = rate ? Math.floor(t * rate) % 2 : 0;
  const [csx, csy] = playing ? drawPlay(playKind, t) : drawCat(cat.x, cat.y, cat.dir, pose, f, cat.alpha);
  if (playing && !reduced) { const p = (t * 0.5) % 1; if (p < 0.6) { g.globalAlpha = 1 - p / 0.6; heart(csx + 5, csy - 2 - Math.round(p * 12)); g.globalAlpha = 1; } }

  // night: dim each room, then lamp glow
  if (night > 0.02) {
    const rooms = [[2, 2, 86, 44, bedLamp], [91, 2, 87, 44, lightsOn], [2, 50, 124, 44, lightsOn], [129, 50, 49, 44, lightsOn]];
    for (const [x, y, w, h, on] of rooms) { g.globalAlpha = night * (on ? 0.16 : 0.55); L(x, y, w, h, '#141a44'); }
    g.globalAlpha = 1;
    if (lightsOn) {
      const glows = [[39, 29, bedLamp], [165, 24, true], [98, 62, true], [150, 54, true]];
      for (const [x, y, on] of glows) if (on) for (let r = 3; r >= 1; r--) { g.globalAlpha = 0.07 * night; L(x - r * 5, y - r * 3, r * 10, r * 6, '#ffd27a'); }
      g.globalAlpha = 1;
    }
  }
  if (pose === 'sleep' && cat.alpha > 0.9) for (let i = 0; i < 3; i++) {
    const p = (t * 0.35 + i / 3) % 1; g.globalAlpha = 1 - p;
    const zx = csx + 11 + p * 6, zy = csy - 1 - p * 10;
    R(zx, zy, 3, 1, '#f6f1ff'); R(zx + 1, zy + 1, 1, 1, '#f6f1ff'); R(zx, zy + 2, 3, 1, '#f6f1ff');
  }
  if (party && cat.alpha > 0.9 && !reduced) { // little hearts float up above the cat now and then
    const p = (t * 0.4) % 1;
    if (p < 0.6) {
      g.globalAlpha = 1 - p / 0.6;
      const hx = csx + 5, hy = csy - 2 - Math.round(p * 12);
      R(hx, hy, 2, 1, '#ff6f91'); R(hx + 3, hy, 2, 1, '#ff6f91'); R(hx, hy + 1, 5, 1, '#ff6f91'); R(hx + 1, hy + 2, 3, 1, '#ff6f91'); R(hx + 2, hy + 3, 1, 1, '#ff6f91');
    }
  }
  g.globalAlpha = 1;
  const pk = party ? LANG + decor : '';
  if (pk !== partyShown) { partyShown = pk; $('party').hidden = !party; if (party) $('party-text').textContent = T('party')[decor]; }

  clockEl.textContent = hhmm(m);
  const ds = fmtDate(d);
  if (ds !== lastDate) { dateEl.textContent = ds; lastDate = ds; }
  const ptxt = playing ? T('playing')[playKind] : '';
  const txt = playing ? T('cat') + (typeof ptxt === 'function' ? ptxt(SEASON) : ptxt) + T('left')(playLeft())
    : (cat.walking ? T('walking') : T('cat') + st.txt);
  if (txt !== lastTxt) { statusEl.textContent = txt; lastTxt = txt; }
  if (st.k !== lastK) { document.querySelectorAll('#sched li').forEach(li => li.classList.toggle('now', li.dataset.k === st.k)); lastK = st.k; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
